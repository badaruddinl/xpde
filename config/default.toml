[server]
bind = "127.0.0.1:8787"
database_path = "data/xpde.sqlite"

[provider]
name = "MetaTrader5"
symbol = "GOLDm#"
timeframe = "M5"
poll_interval_ms = 1000
max_tick_age_ms = 10000

[broker_profile]
broker_policy_id = "goldm-demo-v1"
cost_model_id = "executable-side-rolling-spread-v1"
instrument_name = "GOLD"
asset_class = "Precious Metals"
expected_leverage = 1000
contract_size_oz_per_lot = 1.0
minimum_lot = 0.1
maximum_lot = 100.0
minimum_price_fluctuation = 0.01
advertised_min_spread_usd = 0.24
commission_usd_per_lot = 0.0
expected_exit_spread_usd = 0.34

[model_health]
minimum_settled_predictions = 100
minimum_interval_coverage = 0.70
maximum_interval_coverage = 0.90
maximum_direction_brier = 0.26
maximum_direction_brier_ratio_to_baseline = 1.00
maximum_barrier_brier_ratio_to_baseline = 1.00
maximum_barrier_ece = 0.12
minimum_mae_q90_coverage = 0.80
maximum_mae_q90_coverage = 0.98
degrade_after_failed_windows = 2
suspend_after_severe_windows = 2
recover_after_healthy_windows = 3
warming_up_forces_wait = true

[market_session]
timezone = "broker"
monday = [["01:00", "23:59"]]
tuesday = [["01:00", "23:59"]]
wednesday = [["01:00", "23:59"]]
thursday = [["01:00", "23:59"]]
friday = [["01:00", "22:55"]]
saturday = []
sunday = [["23:05", "23:59"]]
closed_dates = []

[policy.scalper]
max_spread_usd = 0.80
max_spread_atr_ratio = 0.50
slippage_buffer_usd = 0.08
max_entry_deviation_atr = 0.50
min_reward_risk_ratio = 1.00
min_direction_probability = 0.56
min_barrier_probability = 0.52
exit_spread_min_samples = 12
exit_spread_quantile = 0.90
exit_spread_window = 24
maximum_decision_age_seconds = 60

[policy.sniper]
max_spread_usd = 0.55
max_spread_atr_ratio = 0.35
slippage_buffer_usd = 0.08
