[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xpde-mcp-readonly"
version = "0.1.0"
description = "Read-only MCP technical-analysis copilot for XPDE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp[cli]>=1.28.1,<2",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=9.1,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
xpde-mcp = "xpde_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["xpde_mcp*"]

[tool.setuptools.package-data]
xpde_mcp = [
  "schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
