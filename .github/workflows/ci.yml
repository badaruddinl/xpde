name: CI

on:
  push:
    branches: [development, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-training.lock.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r ml/requirements-training.lock.txt
      - run: python -m pip install --no-deps -e ./ml
      - run: python -m pytest -q ml/tests
      - run: python -m pytest -q ml/tests/test_e2e_candidate.py
        env:
          XPDE_RUN_TRAINING_E2E: "1"

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "./mcp[dev]"
      - run: python -m ruff check mcp
      - run: python -m ruff format --check mcp
      - run: python -m pytest -q mcp/tests
      - run: python -m compileall -q mcp/src

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
